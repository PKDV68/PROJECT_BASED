<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Based Contact Form</title>
<!-- Source for assets/docs/contact-form.pdf. Edit here, then run build-pdfs.ps1 in this folder. The header band and footer are added by document.js. -->
<link rel="stylesheet" href="document.css">
<script src="document.js"></script>
</head>
<body>

<section class="page">
  <div class="body">
    <h1>Contact form</h1>
    <p class="intro">Please fill in this form and send it to contact@projectbased.de. We read every message and reply by email.</p>
    <div class="fields">
      <div class="fieldrow"><span>Name</span><span class="box"></span></div>
      <div class="fieldrow"><span>Email</span><span class="box"></span></div>
      <div class="fieldrow"><span>Organisation</span><span class="box"></span></div>
      <div class="fieldrow"><span>Field of interest</span><span class="box"></span></div>
    </div>

    <h2>Message</h2>
    <div class="box xl" style="height: 70mm"></div>

    <div class="note">Send the completed form to contact@projectbased.de.</div>
  </div>
</section>

</body>
</html>
